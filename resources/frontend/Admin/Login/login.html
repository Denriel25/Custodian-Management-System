<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEU Custodian Management System - Login</title>

    <link rel="stylesheet" href="../../Shared/fonts.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <!-- ========================================
             LEFT BRANDING CARD
        ========================================= -->

        <div class="branding-card">

            <div class="logo-container">

                <img
                    src="neu-logo.png"
                    alt="New Era University Logo"
                    class="neu-logo"
                >

            </div>

            <h1>
               Custodian Management System
            </h1>

        </div>


        <!-- ========================================
             RIGHT LOGIN CARD
        ========================================= -->

        <div class="form-box">

            <form id="loginForm">

                <div class="login-header">

                    <h2>Welcome Back</h2>

                    <p>
                        Sign in to your account
                    </p>

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    id="loginButton"
                    name="login">

                    Login

                </button>


                <p class="login-footer">
                    Authorized Personnel Only
                </p>

                <!-- SWITCH TO REQUESTER LOGIN -->
                <p class="switch-login">
                    Requester?
                    <a href="../../Requester/RequesterLogin/login.html">Click here</a>
                </p>

            </form>

        </div>

    </div>


    <script src="../../Shared/audit.js"></script>
    <script src="../../Shared/users.js"></script>
    <script src="login.js"></script>

</body>

</html>
