<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Requester Login</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <link rel="stylesheet" href="../../Shared/fonts.css">
</head>

<body>

    <!-- ========================================
         MAIN LOGIN CONTAINER
    ======================================== -->

    <div class="login-container">


        <!-- ========================================
             LEFT BRANDING CARD
        ======================================== -->

        <div class="branding-card">


            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="../../Admin/Login/neu-logo.png"
                    alt="New Era University Logo"
                    class="neu-logo"
                >

            </div>


            <!-- SYSTEM NAME -->

            <h1>

                Custodian Management System

            </h1>

        </div>


        <!-- ========================================
             LOGIN FORM CARD
        ======================================== -->

        <div class="form-box">


            <form id="loginForm">


                <!-- LOGIN HEADER -->

                <div class="login-header">

                    <h2>

                        Welcome

                    </h2>

                    <p>

                        Sign in to your account

                    </p>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">

                        Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">

                        Password

                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                >

                    Login

                </button>


                <!-- FOOTER -->

                <div class="login-footer">

                    Requester access only

                </div>

                <!-- SWITCH TO ADMIN LOGIN -->
                <p class="switch-login">
                    Admin?
                    <a href="../../Admin/Login/login.html">Click here</a>
                </p>


            </form>


        </div>


    </div>


    <script src="../../Shared/audit.js"></script>
    <script src="../../Shared/users.js"></script>
    <script src="login.js"></script>

</body>

</html>
