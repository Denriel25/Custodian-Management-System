<div class="dashboard-container">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="../../Admin/Login/neu-logo.png" alt="NEU Logo" class="sidebar-logo">
            <div class="sidebar-title"><h2>Custodian Management System</h2></div>
        </div>
        <ul>
            <li><a href="../RequesterDashboard/dashboard.html">Dashboard</a></li>

        <nav class="navbar">
            <div><h2>Notifications</h2><p>Updates about your requisitions</p></div>
            <div class="user-info"><span class="user-role">Requester</span></div>
        </nav>

        <section class="wf-panel light" style="margin-top:20px">
            <h2>Notification List</h2>
            <div class="wf-tools">
                <select class="wf-select" id="nFilter"><option value="all">All</option><option value="unread">Unread</option><option value="read">Read</option></select>
                <button type="button" class="wf-btn" id="markAll">Mark all as read</button>
                <button type="button" class="wf-btn" id="showMail">Simulated emails</button>
            </div>
            <div id="nList"></div>
            <div class="wf-pager" id="nPager"></div>
        </section>
        <p class="wf-note" style="color:#777">Emails are simulated in this frontend phase. Nothing is sent.</p>
    </main>
